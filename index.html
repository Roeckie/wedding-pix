<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap & Share</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --ink: #1a1310;
      --paper: #faf7f2;
      --warm: #e8e0d4;
      --accent: #c94f2a;
      --accent-light: #f0d6ce;
      --muted: #8c7e74;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .card {
      position: relative;
      z-index: 1;
      background: white;
      border: 1px solid var(--warm);
      border-radius: 4px;
      padding: 2.5rem 2rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(26,19,16,0.06), 0 12px 40px rgba(26,19,16,0.07);
      animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.2rem;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .subtext {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* Hidden file input */
    #camera-input { display: none; }

    /* Main CTA button */
    .btn-capture {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-capture:hover  { background: #2e2520; }
    .btn-capture:active { transform: scale(0.98); }

    .btn-capture svg { flex-shrink: 0; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--warm);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--warm);
    }

    /* Gallery upload option */
    .btn-gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--warm);
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-gallery:hover { border-color: var(--ink); color: var(--ink); }

    /* Preview area */
    .preview-area {
      margin-top: 1.75rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .preview-area.visible { display: flex; }

    .preview-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .preview-img-wrap {
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      background: var(--warm);
      aspect-ratio: 4/3;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    .preview-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Upload button */
    .btn-upload {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-upload:hover  { background: #b34020; }
    .btn-upload:active { transform: scale(0.98); }
    .btn-upload:disabled { background: var(--warm); color: var(--muted); cursor: default; }

    /* Retake */
    .btn-retake {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-align: center;
      padding: 0;
    }
    .btn-retake:hover { color: var(--ink); }

    /* Progress bar */
    .progress-wrap {
      height: 3px;
      background: var(--warm);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .progress-wrap.active { display: block; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Success state */
    .success-banner {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      background: #edf7ed;
      border: 1px solid #c3e6c3;
      border-radius: 3px;
      font-size: 0.85rem;
      color: #2d6a2d;
      animation: fadeIn 0.3s ease;
    }
    .success-banner.visible { display: flex; }

    /* Footer */
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="label">Photo upload</p>
    <h1>Snap &amp; <em>share</em></h1>
    <p class="subtext">Take a photo and we'll upload it instantly. No app needed.</p>

    <!-- Hidden inputs — capture= opens rear camera, accept=image/* opens gallery -->
    <input type="file" id="camera-input"  accept="image/*" capture="environment" />
    <input type="file" id="gallery-input" accept="image/*" />

    <button class="btn-capture" onclick="document.getElementById('camera-input').click()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Open Camera
    </button>

    <div class="divider">or</div>

    <button class="btn-gallery" onclick="document.getElementById('gallery-input').click()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Choose from gallery
    </button>

    <!-- Preview + upload -->
    <div class="preview-area" id="preview-area">
      <p class="preview-label">Your photo</p>
      <div class="preview-img-wrap">
        <img id="preview-img" src="" alt="Preview" />
      </div>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="success-banner" id="success-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Photo uploaded successfully!
      </div>

      <button class="btn-upload" id="btn-upload">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
        Upload Photo
      </button>

      <button class="btn-retake" id="btn-retake">Retake / choose another</button>
    </div>

    <p class="footer-note">Photos are uploaded securely. Tap "Open Camera" to start.</p>
  </div>

  <script>
    const cameraInput  = document.getElementById('camera-input');
    const galleryInput = document.getElementById('gallery-input');
    const previewArea  = document.getElementById('preview-area');
    const previewImg   = document.getElementById('preview-img');
    const progressWrap = document.getElementById('progress-wrap');
    const progressBar  = document.getElementById('progress-bar');
    const successBanner= document.getElementById('success-banner');
    const btnUpload    = document.getElementById('btn-upload');
    const btnRetake    = document.getElementById('btn-retake');

    let selectedFile = null;

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;

      // Reset state
      progressWrap.classList.remove('active');
      progressBar.style.width = '0%';
      successBanner.classList.remove('visible');
      btnUpload.disabled = false;
      btnUpload.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
        Upload Photo`;

      // Show preview
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewArea.classList.add('visible');

        // Auto-upload after preview renders
        setTimeout(uploadFile, 300);
      };
      reader.readAsDataURL(file);
    }

    async function uploadFile() {
      if (!selectedFile) return;

      btnUpload.disabled = true;
      progressWrap.classList.add('active');
      progressBar.style.width = '0%';
      successBanner.classList.remove('visible');

      // Animate progress
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 18;
        if (progress > 90) progress = 90;
        progressBar.style.width = progress + '%';
      }, 200);

      try {
        const formData = new FormData();
        formData.append('photo', selectedFile);

        // ⚠️  Replace this URL with your actual upload endpoint.
        // e.g. "https://yourserver.com/upload"
        // For demo purposes, we simulate a successful upload.
        const UPLOAD_URL = ''; // ← set your endpoint here

        if (UPLOAD_URL) {
          const res = await fetch(UPLOAD_URL, { method: 'POST', body: formData });
          if (!res.ok) throw new Error('Upload failed');
        } else {
          // Demo simulation: wait 1.5s to mimic network
          await new Promise(r => setTimeout(r, 1500));
        }

        clearInterval(interval);
        progressBar.style.width = '100%';
        setTimeout(() => {
          progressWrap.classList.remove('active');
          successBanner.classList.add('visible');
          btnUpload.disabled = false;
          btnUpload.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Uploaded!`;
        }, 400);

      } catch (err) {
        clearInterval(interval);
        progressBar.style.width = '0%';
        progressWrap.classList.remove('active');
        btnUpload.disabled = false;
        btnUpload.textContent = 'Retry upload';
        alert('Upload failed. Please try again.');
      }
    }

    cameraInput.addEventListener('change',  e => handleFile(e.target.files[0]));
    galleryInput.addEventListener('change', e => handleFile(e.target.files[0]));

    btnUpload.addEventListener('click', uploadFile);

    btnRetake.addEventListener('click', () => {
      selectedFile = null;
      cameraInput.value  = '';
      galleryInput.value = '';
      previewArea.classList.remove('visible');
      previewImg.src = '';
    });
  </script>
</body>
</html>
