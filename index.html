<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share a Memory 💍</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    :root {
      --cream: #fdf9f4;
      --white: #ffffff;
      --gold: #b8966e;
      --gold-light: #f0e6d8;
      --ink: #2c2420;
      --muted: #9c8e86;
      --border: #e8ddd4;
      --success: #4a7c59;
      --success-bg: #edf4ef;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      position: relative;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url('background.jpg') center center / cover no-repeat;
      filter: blur(12px);
      transform: scale(1.05);
      z-index: -1;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(253, 249, 244, 0.45);
      z-index: -1;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(44,36,32,0.07);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .subtext {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 0.8rem;
    }

    .btn-camera {
      background: var(--ink);
      color: white;
    }

    .btn-gallery {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    #camera-input, #gallery-input { display: none; }

    .preview-section { display: none; margin-top: 1rem; }
    .preview-section.visible { display: block; }

    .preview-wrap {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--gold-light);
      margin-bottom: 1rem;
    }

    .preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-track {
      height: 2px;
      background: var(--border);
      display: none;
    }
    .progress-track.active { display: block; }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
    }

    .status {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .status.visible { display: block; }

    .success { color: var(--success); }
    .error { color: #a03820; }

  </style>
</head>

<body>

<div class="card">
  <h1>Share a Memory 💍</h1>
  <p class="subtext">Take or upload a photo</p>

  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="gallery-input" accept="image/*">

  <button class="btn btn-camera" onclick="cameraInput.click()">Take Photo</button>
  <button class="btn btn-gallery" onclick="galleryInput.click()">Upload from Gallery</button>

  <div class="preview-section" id="preview-section">
    <div class="preview-wrap">
      <img id="preview-img" />
    </div>

    <div class="progress-track" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="status" id="status-uploading">Uploading...</div>
    <div class="status success" id="status-success">Uploaded successfully 🎉</div>
    <div class="status error" id="status-error">Upload failed</div>
  </div>
</div>

<script>
const CLOUD_NAME = 'dzvstnapa';
const UPLOAD_PRESET = 'rn2ysjxt';
const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

const cameraInput = document.getElementById('camera-input');
const galleryInput = document.getElementById('gallery-input');

const previewSection = document.getElementById('preview-section');
const previewImg = document.getElementById('preview-img');

const progressTrack = document.getElementById('progress-track');
const progressFill = document.getElementById('progress-fill');

const statusUploading = document.getElementById('status-uploading');
const statusSuccess = document.getElementById('status-success');
const statusError = document.getElementById('status-error');

function reset() {
  statusUploading.classList.remove('visible');
  statusSuccess.classList.remove('visible');
  statusError.classList.remove('visible');
  progressTrack.classList.remove('active');
  progressFill.style.width = '0%';
}

function handleFile(file) {
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    previewImg.src = e.target.result;
    previewSection.classList.add('visible');
    uploadFile(file);
  };
  reader.readAsDataURL(file);
}

async function uploadFile(file) {
  reset();
  progressTrack.classList.add('active');
  statusUploading.classList.add('visible');

  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 20;
    if (progress > 85) progress = 85;
    progressFill.style.width = progress + '%';
  }, 200);

  try {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    const res = await fetch(CLOUDINARY_URL, {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (!data.secure_url) throw new Error('Upload failed');

    clearInterval(interval);
    progressFill.style.width = '100%';

    setTimeout(() => {
      statusUploading.classList.remove('visible');
      statusSuccess.classList.add('visible');
    }, 300);

    console.log('Uploaded:', data.secure_url);

  } catch (err) {
    clearInterval(interval);
    statusUploading.classList.remove('visible');
    statusError.classList.add('visible');
  }
}

cameraInput.addEventListener('change', e => handleFile(e.target.files[0]));
galleryInput.addEventListener('change', e => handleFile(e.target.files[0]));
</script>

</body>
</html>
