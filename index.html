<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Share a Memory 💍</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

:root {
  --cream: #fdf9f4;
  --white: #ffffff;
  --gold: #b8966e;
  --gold-light: #f0e6d8;
  --ink: #2c2420;
  --muted: #9c8e86;
  --border: #e8ddd4;
  --success: #4a7c59;
  --success-bg: #edf4ef;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Jost', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.25rem 3rem;
  position: relative;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: url('background.jpg') center / cover no-repeat;
  filter: blur(12px);
  transform: scale(1.05);
  z-index: -1;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(253, 249, 244, 0.45);
  z-index: -1;
}

.flourish {
  text-align: center;
  margin-bottom: 1.5rem;
  opacity: 0.35;
}

.flourish svg { width: 120px; }

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 4px 24px rgba(44,36,32,0.07);
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.6rem;
  font-weight: 300;
  margin-bottom: 0.4rem;
}

h1 em { color: var(--gold); }

.subtext {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 1rem;
}

.divider-line {
  width: 48px;
  height: 1px;
  background: var(--gold);
  margin: 0 auto 2rem;
  opacity: 0.5;
}

#camera-input, #gallery-input {
  display: none;
}

.btn-camera, .btn-gallery {
  width: 100%;
  padding: 1rem;
  border-radius: 2px;
  cursor: pointer;
}

.btn-camera {
  background: var(--ink);
  color: white;
  border: none;
}

.btn-gallery {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  margin-top: 10px;
}

.queue {
  text-align: left;
  margin-top: 1rem;
  font-size: 0.75rem;
  color: var(--muted);
}

.queue-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.progress-track {
  height: 2px;
  background: var(--border);
  margin-top: 1rem;
  display: none;
}

.progress-track.active { display: block; }

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--gold);
}

.status {
  margin-top: 1rem;
  font-size: 0.82rem;
  display: none;
}

.status.visible { display: block; }

.success {
  color: var(--success);
  background: var(--success-bg);
  padding: 0.75rem;
  border: 1px solid #c3dbc9;
}

.error {
  color: #a03820;
  background: #fdf0ed;
  padding: 0.75rem;
  border: 1px solid #f0c4b8;
}

.footer {
  margin-top: 1rem;
  font-size: 0.7rem;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="flourish">
  <svg viewBox="0 0 120 40" fill="none">
    <circle cx="40" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
    <circle cx="80" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
  </svg>
</div>

<div class="card">
  <h1>A <em>Memory</em></h1>
  <p class="subtext">Upload your moments 💍</p>
  <div class="divider-line"></div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" multiple />
  <input type="file" id="gallery-input" accept="image/*" multiple />

  <button class="btn-camera" onclick="cameraInput.click()">Take Photo(s)</button>
  <button class="btn-gallery" onclick="galleryInput.click()">Upload from gallery</button>

  <div class="queue" id="queue"></div>

  <div class="progress-track" id="track">
    <div class="progress-fill" id="fill"></div>
  </div>

  <div class="status success" id="success">All photos uploaded 🎉</div>
  <div class="status error" id="error">Some uploads failed</div>
</div>

<p class="footer">Made with love</p>

<script>
const CLOUD_NAME = 'dzvstnapa';
const UPLOAD_PRESET = 'rn2ysjxt';
const URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

const cameraInput = document.getElementById('camera-input');
const galleryInput = document.getElementById('gallery-input');

const queueEl = document.getElementById('queue');
const fill = document.getElementById('fill');
const track = document.getElementById('track');
const success = document.getElementById('success');
const error = document.getElementById('error');

function reset() {
  queueEl.innerHTML = '';
  fill.style.width = '0%';
  success.classList.remove('visible');
  error.classList.remove('visible');
}

function renderQueue(files) {
  queueEl.innerHTML = '';
  files.forEach(f => {
    const div = document.createElement('div');
    div.className = 'queue-item';
    div.innerHTML = `<span>${f.name}</span><span>waiting</span>`;
    queueEl.appendChild(div);
  });
}

async function uploadFiles(files) {
  reset();
  track.classList.add('active');

  const list = [...files];
  renderQueue(list);

  let done = 0;
  let failed = 0;

  for (let i = 0; i < list.length; i++) {
    const file = list[i];
    const row = queueEl.children[i];

    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      formData.append('tags', 'wedding');
      formData.append('folder', 'wedding');

      const res = await fetch(URL, { method: 'POST', body: formData });
      const json = await res.json();

      if (!json.secure_url) throw new Error();

      row.children[1].textContent = 'done';
      done++;

    } catch {
      row.children[1].textContent = 'failed';
      failed++;
    }

    fill.style.width = ((i + 1) / list.length) * 100 + '%';
  }

  track.classList.remove('active');

  if (failed === 0) {
    success.classList.add('visible');
  } else {
    error.classList.add('visible');
  }
}

cameraInput.addEventListener('change', e => uploadFiles(e.target.files));
galleryInput.addEventListener('change', e => uploadFiles(e.target.files));
</script>

</body>
</html>
