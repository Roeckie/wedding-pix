<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Gallery 💍</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    :root {
      --cream: #fdf9f4;
      --white: #ffffff;
      --gold: #b8966e;
      --gold-light: #f0e6d8;
      --ink: #2c2420;
      --muted: #9c8e86;
      --border: #e8ddd4;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      position: relative;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url('background.jpg') center/cover no-repeat;
      filter: blur(12px);
      transform: scale(1.05);
      z-index: -1;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(253, 249, 244, 0.45);
      z-index: -1;
    }

    .flourish {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .flourish svg {
      width: 120px;
      opacity: 0.35;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 2.5rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
      box-shadow: 0 4px 24px rgba(44,36,32,0.07);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 300;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .subtext {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .divider-line {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2rem;
      opacity: 0.5;
    }

    /* MASONRY */
    .masonry {
      column-count: 3;
      column-gap: 12px;
    }

    @media (max-width: 900px) { .masonry { column-count: 2; } }
    @media (max-width: 600px) { .masonry { column-count: 1; } }

    .photo {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--gold-light);
    }

    .photo img {
      width: 100%;
      display: block;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }

    /* 🔐 LOCK SCREEN */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(253, 249, 244, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .lock-box {
      text-align: center;
      max-width: 300px;
    }

    .lock-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 1rem;
      margin-top: 10px;
    }

    .lock-box button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      background: var(--ink);
      color: white;
      cursor: pointer;
    }

    .error {
      color: #a03820;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

<!-- 🔐 LOCK SCREEN -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>Private Gallery</h2>
    <p style="color:#9c8e86;font-size:0.85rem;">Enter passcode</p>

    <input type="password" id="passcode" placeholder="Passcode" />
    <button onclick="unlock()">Enter</button>

    <div class="error" id="error">Wrong passcode</div>
  </div>
</div>

<div class="flourish">
  <svg viewBox="0 0 120 40" fill="none">
    <circle cx="40" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
    <circle cx="80" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
  </svg>
</div>

<div class="card">
  <h1>A <em>Memory</em> Gallery</h1>
  <p class="subtext">Captured moments 💍</p>
  <div class="divider-line"></div>

  <div class="loading" id="loading">Unlock to load memories</div>
  <div class="masonry" id="masonry"></div>
</div>

<script>
const CLOUD_NAME = "dzvstnapa";
const TAG = "wedding";
const PASSCODE = "chickennugget"; // 👈 CHANGE THIS

const SEARCH_URL =
  `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`;

let unlocked = false;

function unlock() {
  const input = document.getElementById("passcode").value;
  const error = document.getElementById("error");

  if (input !== PASSCODE) {
    error.style.display = "block";
    return;
  }

  document.getElementById("lockScreen").style.display = "none";
  unlocked = true;
  loadImages();
}

async function loadImages() {
  if (!unlocked) return;

  try {
    const res = await fetch(SEARCH_URL);
    const data = await res.json();

    const masonry = document.getElementById("masonry");
    const loading = document.getElementById("loading");

    masonry.innerHTML = "";
    loading.style.display = "none";

    const seen = new Set();

    data.resources
      .slice()
      .reverse()
      .forEach(img => {
        if (seen.has(img.public_id)) return;
        seen.add(img.public_id);

        const url =
          `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${img.public_id}.${img.format}`;

        const div = document.createElement("div");
        div.className = "photo";

        const image = document.createElement("img");
        image.src = url;
        image.loading = "lazy";

        div.appendChild(image);
        masonry.appendChild(div);
      });

  } catch (err) {
    document.getElementById("loading").innerText =
      "Failed to load gallery.";
  }
}

// optional live refresh after unlock
setInterval(loadImages, 8000);
</script>

</body>
</html>
