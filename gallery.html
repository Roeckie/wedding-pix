<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Gallery 💍</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

    :root {
      --cream: #fdf9f4;
      --white: #ffffff;
      --gold: #b8966e;
      --gold-light: #f0e6d8;
      --ink: #2c2420;
      --muted: #9c8e86;
      --border: #e8ddd4;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      position: relative;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url('background.jpg') center center / cover no-repeat;
      filter: blur(12px);
      transform: scale(1.05);
      z-index: -1;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(253, 249, 244, 0.45);
      z-index: -1;
    }

    .flourish {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .flourish svg {
      width: 120px;
      opacity: 0.35;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 2.5rem 2rem;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 4px 24px rgba(44,36,32,0.07);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 300;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .subtext {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .divider-line {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2rem;
      opacity: 0.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--gold-light);
      transition: transform 0.2s ease;
    }

    .img:hover {
      transform: scale(1.02);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="flourish">
    <svg viewBox="0 0 120 40" fill="none">
      <circle cx="40" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
      <circle cx="80" cy="20" r="17" stroke="#b8966e" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="card">
    <h1>A <em>Memory</em> Gallery</h1>
    <p class="subtext">All captured moments 💍</p>
    <div class="divider-line"></div>

    <div class="loading" id="loading">Loading memories...</div>
    <div class="grid" id="grid"></div>

    <p class="footer">Made with love</p>
  </div>

<script>
const CLOUD_NAME = "dzvstnapa";
const TAG = "wedding";

const SEARCH_URL =
  `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`;

let isRendering = false;

async function loadImages() {
  if (isRendering) return;
  isRendering = true;

  try {
    const res = await fetch(SEARCH_URL);
    if (!res.ok) throw new Error("Cloudinary list failed");

    const data = await res.json();

    const grid = document.getElementById("grid");
    const loading = document.getElementById("loading");

    // ✅ IMPORTANT FIX: clear old images
    grid.innerHTML = "";

    loading.style.display = "none";

    if (!data.resources || data.resources.length === 0) {
      loading.innerText = "No memories yet 💛";
      loading.style.display = "block";
      return;
    }

    const seen = new Set();

    data.resources
      .slice()
      .reverse()
      .forEach(img => {
        if (seen.has(img.public_id)) return;
        seen.add(img.public_id);

        const url =
          `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${img.public_id}.${img.format}`;

        const el = document.createElement("img");
        el.src = url;
        el.className = "img";

        grid.appendChild(el);
      });

  } catch (err) {
    console.error(err);
    document.getElementById("loading").innerText =
      "Failed to load gallery.";
  } finally {
    isRendering = false;
  }
}

loadImages();

// safe live refresh
setInterval(loadImages, 8000);
</script>

</body>
</html>
